version: 2
updates:
  # bun, not npm: the npm ecosystem updates package.json but not bun.lock,
  # so every PR failed CI at bun install --frozen-lockfile.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
